name: Build FrozenApp UI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_module_bundle:
        description: 'Build a complete Frozen module ZIP with this APK'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrozenApp-8.1.1-ui-beta12
          path: app/build/outputs/apk/release/Frozen.apk
          if-no-files-found: error
      - name: Checkout Frozen module
        uses: actions/checkout@v4
        with:
          repository: liyunkkk/FrozenVS
          ref: fix/activity-aware-freeze
          path: module-source
      - name: Test, build and pack complete module
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          clang++ -std=c++23 -O1 -Wall -Wextra \
            -Imodule-source/FrozenVS/include \
            module-source/FrozenVS/test/test_rekernel.cpp \
            -o /tmp/test_rekernel
          /tmp/test_rekernel
          cp app/build/outputs/apk/release/Frozen.apk \
            module-source/FrozenVS/magisk/Frozen.apk
          chmod +x module-source/FrozenVS/build_pack.sh
          module-source/FrozenVS/build_pack.sh
          mkdir -p module-output
          cp module-source/FrozenVS/Frozen-*.zip \
            module-output/Frozen-9.0.3-activity-beta3-ui-beta12.zip
      - name: Verify complete module contents
        run: |
          test "$(unzip -Z1 module-output/Frozen-9.0.3-activity-beta3-ui-beta12.zip | grep -cx '^Frozen$')" -eq 1
          test "$(unzip -Z1 module-output/Frozen-9.0.3-activity-beta3-ui-beta12.zip | grep -cx '^Frozen\.apk$')" -eq 1
          unzip -p module-output/Frozen-9.0.3-activity-beta3-ui-beta12.zip module.prop \
            | grep -E '^version=9\.0\.3-activity-beta3'
          unzip -p module-output/Frozen-9.0.3-activity-beta3-ui-beta12.zip Frozen.apk \
            > /tmp/bundled-Frozen.apk
          cmp -s /tmp/bundled-Frozen.apk app/build/outputs/apk/release/Frozen.apk
          test "$(stat -c '%s' /tmp/bundled-Frozen.apk)" -gt 1000000
      - name: Upload complete flashable module
        uses: actions/upload-artifact@v4
        with:
          name: Frozen-9.0.3-activity-beta3-ui-beta12
          path: module-output/Frozen-9.0.3-activity-beta3-ui-beta12.zip
          if-no-files-found: error
